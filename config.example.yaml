# Example quota controller configuration.
#
#   cp config.example.yaml config.yaml     # config.yaml is git-ignored
#   chmod 600 config.yaml
#
# Every setting below is optional: the service starts from its built-in defaults.
# Precedence is defaults < this file < environment variables. Point the service
# at a file with QUOTA_ROUTER_CONFIG_FILE=config.yaml.
#
# Real credentials do not belong in this file, and the service rejects any
# Secret field here as a startup error. Set them through the environment
# (QUOTA_ROUTER_AUTH__TOKEN, QUOTA_ROUTER_PROVIDERS__<NAME>__API_KEY) or a
# mounted secret file. See README.md.

server:
  addr: ":8080"
  shutdown_timeout: 10s
  read_header_timeout: 5s
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s

litellm:
  base_url: http://127.0.0.1:4000
  model_aliases:
    fast: minimax/MiniMax-M2.7

providers:
  # Provider base URLs are quota surfaces read by the Controller, never inference
  # endpoints: LiteLLM owns inference. MiniMax serves quota from www.minimax.io
  # while inference lives on api.minimax.io, so pointing this at the inference
  # host silently polls nothing.
  minimax:
    base_url: https://www.minimax.io/v1
    # api_key: set QUOTA_ROUTER_PROVIDERS__MINIMAX__API_KEY to the Token Plan
    # subscription key (sk-cp-...), the same credential litellm uses.

polling:
  interval: 30s
  request_timeout: 10s

routing:
  # Remaining-quota fraction at or below which a provider counts as scarce.
  low_quota_threshold: 0.1

sqlite:
  path: quota-router.db
  # How long to wait for another writer before reporting a busy database.
  busy_timeout: 5s
  # History kept locally. 0 keeps a table forever. The newest snapshot and
  # health row per provider always survive, because routing reads them.
  retention:
    quota_snapshots: 720h   # 30 days
    provider_health: 720h   # 30 days
    usage_records: 2160h    # 90 days

auth:
  # Bearer token for the controller's own HTTP API (issues #18, #36).
  # token: set QUOTA_ROUTER_AUTH__TOKEN instead

observability:
  level: info
