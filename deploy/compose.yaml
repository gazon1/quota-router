name: quota-router

# Home-host deployment: two independent containers, no dependency edge between
# them. LiteLLM serves LLM traffic on its own; the Controller is a sidecar that
# can be stopped, restarted or upgraded without interrupting the proxy.
services:
  quota-controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controller
    image: quota-controller:local
    restart: unless-stopped
    read_only: true
    # Measurement target from issue #6: measured VmHWM 14 MiB at 5.5k req/s of
    # /health. With SQLite (issue #12) idle VmHWM is 10.2 MiB, so 128 MiB keeps
    # ~12x headroom; re-measure once quota polling lands (issue #13).
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # No host port: /health is the only route today, so the controller stays
    # reachable only inside the compose network. Publish one when a real API
    # exists (issue #18).
    # The controller writes quota snapshots, usage and health to SQLite, so its
    # database must survive a container restart. A named volume, not a bind mount:
    # Compose owns the path and the file stays owned by the container user.
    # read_only stays true because the volume is mounted read-write on its own.
    volumes:
      - controller-db:/var/lib/quota-router
    environment:
      QUOTA_ROUTER_SQLITE__PATH: /var/lib/quota-router/quota-router.db
    networks: [internal]

  litellm:
    # Pinned by tag and digest. v1.110.0 is a Python 3.13 proxy that ships a
    # compiled Rust core; per its route table, chat_completions is PYTHON_ONLY,
    # so this deployment's request path is Python. Never use latest/stable.
    # See docs/deployment.md for the measured route matrix.
    image: ghcr.io/berriai/litellm:v1.110.0@sha256:4295b064b22eb88f9530e616afc812edd47048891ba64896bfc3fa74e2b883c3
    restart: unless-stopped
    command: ["--config", "/app/config.yaml"]
    env_file: [.env]
    # Measured VmHWM 666 MiB idle with one model configured; 1 GiB gives room
    # for request load. Tune from `docker stats`, not from this comment.
    mem_limit: 1g
    cpus: 2
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    ports:
      # Localhost only by default. Use "4000:4000" to serve the LAN.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold start to /health/readiness 200 measured at 18s on this host.
      start_period: 40s
    networks: [internal]

networks:
  internal:

volumes:
  # Backup/restore for this volume is in docs/storage.md. Removing it discards
  # the persisted quota state; the controller re-learns it by polling.
  controller-db:
